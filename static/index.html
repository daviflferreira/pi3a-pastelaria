<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de Cardápio</title>
  <link rel="icon" href="/icone.png">
  <link rel="stylesheet" href="/estilo.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topo">
    <img class="mascote" src="/mascote.png" alt="" width="420" height="289">
    <div class="topo-texto">
      <h1 id="nome-loja">Cantinho do Pastel</h1>
      <div class="topo-linha">
        <span id="status" class="status">…</span>
      </div>
      <p id="contato" class="contato"></p>
      <p id="horarios" class="horarios"></p>
    </div>
  </header>

  <div class="busca">
    <input id="campo-busca" type="search" autocomplete="off" autofocus
           placeholder="Buscar sabor ou ingrediente (ex.: frango, catupiry, pequi)">
  </div>

  <nav id="categorias" class="categorias"></nav>

  <p id="aviso" class="aviso" hidden></p>

  <main id="cardapio"></main>

  <footer class="rodape">
    <span id="contagem"></span>
    <span>Comunicação com o servidor protegida por TLS · <a href="/admin" class="link-discreto">Área do dono</a></span>
  </footer>
</body>
</html>
